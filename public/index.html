<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NoteVault — your notes, safe & searchable</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- ============ AUTH VIEW ============ -->
<div id="auth-view" class="view">
  <div class="auth-card">
    <div class="brand"><span class="brand-mark">🗝</span> NoteVault</div>
    <p class="muted">Your personal notes — private, searchable, always with you.</p>
    <div class="tabs">
      <button id="tab-signin" class="tab active" type="button">Sign in</button>
      <button id="tab-signup" class="tab" type="button">Create account</button>
    </div>
    <form id="auth-form" novalidate>
      <label id="name-label" class="hidden">Name
        <input id="auth-name" type="text" placeholder="Your name" autocomplete="name">
      </label>
      <label>Email
        <input id="auth-email" type="email" placeholder="you@example.com" autocomplete="email" required>
      </label>
      <label>Password
        <input id="auth-password" type="password" placeholder="Min. 6 characters" autocomplete="current-password" required>
      </label>
      <p id="auth-error" class="error hidden"></p>
      <button id="auth-submit" class="btn primary" type="submit">Sign in</button>
    </form>
  </div>
</div>

<!-- ============ APP VIEW ============ -->
<div id="app-view" class="view hidden">
  <header class="topbar">
    <div class="brand small"><span class="brand-mark">🗝</span> NoteVault</div>
    <div class="topbar-right">
      <span id="user-name" class="user-name"></span>
      <button id="btn-signout" class="btn ghost" type="button">Sign out</button>
    </div>
  </header>

  <main class="container">
    <div class="toolbar">
      <input id="search" type="search" placeholder="🔍 Search notes…" autocomplete="off">
      <div id="tag-chips" class="chips"></div>
      <button id="btn-new" class="btn primary" type="button">+ New note</button>
    </div>

    <p id="empty-state" class="empty hidden">No notes yet. Click <b>+ New note</b> to write your first one.</p>
    <div id="notes-grid" class="grid"></div>
  </main>
</div>

<!-- ============ EDITOR MODAL ============ -->
<div id="editor-backdrop" class="backdrop hidden">
  <div class="editor" role="dialog" aria-modal="true" aria-label="Note editor">
    <input id="note-title" type="text" placeholder="Note title" maxlength="200">
    <input id="note-tags" type="text" placeholder="tags, comma separated (e.g. work, ideas)">
    <textarea id="note-body" placeholder="Write your note here…" rows="12"></textarea>
    <p id="editor-error" class="error hidden"></p>
    <div class="editor-actions">
      <button id="btn-delete" class="btn danger hidden" type="button">Delete</button>
      <span class="spacer"></span>
      <button id="btn-cancel" class="btn ghost" type="button">Cancel</button>
      <button id="btn-save" class="btn primary" type="button">Save note</button>
    </div>
  </div>
</div>

<div id="toasts" class="toasts" aria-live="polite"></div>

<script src="js/app.js"></script>
</body>
</html>
